name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean build, kernel checks, and the WebAssembly build against native Lean and Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
          build: true
          test: false
          lint: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native Lean and the Python reference, n = 1..10000 and the random sample
        run: |
          lake build tunnell_cli
          mkdir -p tests/out
          .lake/build/bin/tunnell_cli 1 10000 > tests/out/nativo.txt
          .lake/build/bin/tunnell_cli --ns $(cat tests/azar.txt) > tests/out/nativo-azar.txt
          python tests/referencia_rapida.py 1 10000 > tests/out/python.txt
          python tests/referencia_rapida.py --ns $(cat tests/azar.txt) > tests/out/python-azar.txt
      - name: The WebAssembly build against them (tests/pruebas.mjs)
        run: node tests/pruebas.mjs
      - name: Brute-force reference and OEIS, n = 1..400 (diferencial.mjs)
        run: |
          python referencia.py 400
          node diferencial.mjs
      - name: Big-number arithmetic (Arith.lean) against Python, five operations at three sizes
        run: |
          for op in 0 1 2 3 4; do for bits in 64 1024 4096; do
            lean=$(.lake/build/bin/tunnell_cli --arith $op $bits 8 1 | head -1)
            py=$(python bench/experimentos/aritmetica_ref.py $op $bits 8)
            [ "$lean" = "$py" ] || { echo "op $op, $bits bits: Lean $lean, Python $py"; exit 1; }
          done; done
          echo "15 of 15 checksums agree"
      - name: Lean's mpn_mul alone (report § 4.11), the extract and its variants against BigInt
        run: node bench/experimentos/kernel/comprobar.mjs
